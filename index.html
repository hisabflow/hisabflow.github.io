r.onresult=e=>{const t=e.results[0][0].transcript,m=t.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).match(/\d+(\.\d+)?/),c=[...CI,...CE].find(x=>t.includes(x))||(EK.find(w=>t.toLowerCase().includes(w[0]))||[0,'অন্যান্য'])[1],inc=CI.includes(c);addTx(inc?'in':'out',0,{amt:m?+m[0]:0,cat:c,note:t})};r.onerror=()=>alert('শুনতে পারিনি, আবার চেষ্টা করুন');r.start()}

function aiAnswer(q){
 const n=q.toLowerCase(),lastM=x=>ym(x.date)==aiPM();

 if(/তুলনা|গত মাস|compare|last month/.test(n)){

 if(/বেশি|সবচেয়ে|top|খাত|কোথায়|category/.test(n)){
  const r=CE.map(c=>[c,spent(c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(!r.length)return 'এই মাসে এখনো কোনো খরচ যোগ হয়নি।';

 if(!BDM()&&/পাঠ|রেমিট্যান্স|remit|send/.test(n)){const t=S.send.filter(thisM);return t.length?'এই মাসে '+bn(t.length)+' বার দেশে পাঠিয়েছেন, মোট ৳ '+bn(t.reduce((a,x)=>a+sb(x),0))+'।':'এই মাসে এখনো দেশে টাকা পাঠানো হয়নি।'}

  if(a)Object.assign(a,o);else{o.id=id();o.status='আছে';FM().an.push(o);a=o}
  if(a.status=='আছে')a.end='';else if(!a.end)a.end=today();
  mir(a,'out','পশু ক্রয়',a.buy,a.date,(L(KI,a.kind)+' '+(a.tag||'')).trim());save();
 },a?{...a}:{date:today(),qty:1});
};
window.fmDone=function(i){
 const v=FM().vc.find(x=>x.id==i);if(!v)return;
 if(!(v.cost>0)){const c=num(prompt(T('খরচ কত? (না থাকলে ০)','Cost? (0 if none)'),'0'));if(c>0)v.cost=c}
 v.done=1;v.donedate=today();if(v.cost>0)mir(v,'out','টিকা ও ওষুধ',v.cost,v.donedate,v.what);save();
};
window.fmCollect=function(i){
 const s=FM().sl.find(x=>x.id==i);if(!s)return;const d=(s.amt||0)-(s.paid||0);if(d<=0)return;
 const v=num(prompt(T('কত টাকা পেলেন? (বাকি '+bn(d)+')','How much did you receive? (unpaid '+bn(d)+')'),d));
 if(v>0){s.paid=Math.min(s.amt,(s.paid||0)+v);mir(s,'in','খামার বিক্রি',s.paid,s.date,[L(SL,s.what),s.buyer].filter(Boolean).join(' · '));save()}
};
function dropRec(k,i){
 const f=FM(),ix=f[k].findIndex(x=>x.id==i);if(ix<0)return;const r=f[k][ix];
 const t=S.tx.findIndex(x=>x.id==r.txid);if(t>-1)S.tx.splice(t,1);
 f[k].splice(ix,1);
 if(k=='an')['fd','ex','vc','sl'].forEach(q=>f[q].forEach(x=>{if(x.aid==i)x.aid=''}));
}
window.fmDel=function(k,i){if(confirm(T('মুছবেন?','Delete?'))){dropRec(k,i);save()}};
window.farmTxDel=function(txid){const f=FM();['an','fd','sl','vc','ex'].forEach(k=>{const r=f[k].find(x=>x.txid==txid);if(r){delete r.txid;dropRec(k,r.id)}})};
window.fmField=function(k){S.field=k;persist();go()};
window.fldHtml=v=>{FM();return S.flds.length>1?`<label>${T('ক্ষেত্র','Field')}<select data-x="fld">${S.flds.map(k=>`<option value="${esc(k)}" ${(v||FLD0())==k?'selected':''}>${esc(k)}</option>`).join('')}</select></label>`:''};

/* ---------- home: field chips + vaccine notice ---------- */
const chips=()=>{FM();if(S.flds.length<2)return '';const mk=(k,l)=>`<button class="${(S.field||'')==k?'on':''}" onclick="fmField('${k}')">${l}</button>`;return `<div class="fm-chips">${mk('',T('সব','All'))}${S.flds.map(k=>mk(k,esc(L(FD,k)))).join('')}</div>`};
const notice=()=>{const d=dueVc(in7());return d.length?`<div class="notice warn">💉 ${T('টিকা/ওষুধের সময়','Vaccine / medicine due')}: ${esc(d.slice(0,3).map(vname).join(', '))}</div>`:''};
const _home=R.home;
window.fmHomeBlock=function(){FM();return chips()+(S.flds.length>1?fieldCard():'')+(S.flds.includes('খামার')?notice():'')};

/* ---------- farm page ---------- */
const fr=(a,b,c,cls,k,i,extra)=>`<div class=row><div>${esc(a)}<small>${esc(b||'')}</small></div><div class="${cls||''}">${c}${extra||''}<button class=x onclick="fmAdd('${k}',${i})">✎</button><button class=x onclick="fmDel('${k}',${i})">✕</button></div></div>`;
const fieldCard=()=>{const fl=S.flds.map(k=>{const t=S.tx.filter(x=>(!x.ct||x.ct==S.work)&&(x.fld||FLD0())==k&&thisM(x));const i=t.filter(x=>x.t=='in').reduce((n,x)=>n+D(x.amt-(x.cut||0),x.cur),0),e=t.filter(x=>x.t=='out').reduce((n,x)=>n+D(x.amt,x.cur),0);return [k,i,e]});const ti=fl.reduce((n,x)=>n+x[1],0),te=fl.reduce((n,x)=>n+x[2],0);return `<h3>${T('এই মাসে ক্ষেত্র অনুযায়ী','This month by field')}</h3><div class=card>${fl.map(x=>row(L(FD,x[0]),T('আয় ','In ')+M(x[1])+' · '+T('খরচ ','Out ')+M(x[2]),sgn(x[1]-x[2]),x[1]-x[2]>=0?'pos':'neg')).join('')}${fl.length>1?row(T('সব মিলিয়ে','Total'),T('আয় ','In ')+M(ti)+' · '+T('খরচ ','Out ')+M(te),sgn(ti-te),ti-te>=0?'pos':'neg'):''}</div>`};
const sgn=v=>(v>=0?'+':'−')+M(Math.abs(v));
R.farm=function(){
 const f=FM();
 const sales=sm(f.sl,'amt'),due=sales-sm(f.sl,'paid'),spent=sm(f.an,'buy')+sm(f.fd,'amt')+sm(f.ex,'amt')+f.vc.filter(v=>v.done).reduce((n,v)=>n+(v.cost||0),0),prof=sales-spent;
 const rem=dueVc(in7());
 const anim=f.an.slice().reverse().map(a=>{
  const c=cost(a),d=days(a),closed=a.status!='আছে',show=closed||c.sold>0;
  return `<div class=card><b>${esc(L(KI,a.kind))} ${esc(a.tag||'')}${a.qty>1?' × '+bn(a.qty):''}</b> <small>· ${L(ST,a.status)}${a.breed?' · '+esc(a.breed):''}${a.wt?' · '+bn(a.wt)+' '+T('কেজি','kg'):''}</small>
  <div class=row><div>${T('কেনা','Bought')}</div><div>${M(c.buy)}</div></div>
  <div class=row><div>${T('খাবার','Feed')}<small>${T('দিনে প্রায়','≈ per day')} ${M(c.feed/d)}</small></div><div>${M(c.feed)}</div></div>
  <div class=row><div>${T('টিকা/ওষুধ/অন্য','Medicine / other')}</div><div>${M(c.oth)}</div></div>
  <div class=row><div>${T('বিক্রি','Sales')}</div><div class=pos>${M(c.sold)}</div></div>
  <div class=row><div><b>${show?T('লাভ-ক্ষতি','Profit / loss'):T('এ পর্যন্ত মোট খরচ','Cost so far')}</b></div><div class="${show?(c.profit>=0?'pos':'neg'):''}"><b>${show?sgn(c.profit):M(c.tot)}</b></div></div>
  <div style="display:flex;gap:6px;margin-top:6px">${closed?'':`<button class=bt style="margin:0" onclick="fmSell(${a.id})">${T('বিক্রি করুন','Sell')}</button>`}<button class=x onclick="fmAdd('an',${a.id})">✎</button><button class=x onclick="fmDel('an',${a.id})">✕</button></div></div>`}).join('')||`<small>${T('এখনো কোনো পশু/ব্যাচ নেই','No animals or batches yet')}</small>`;
 const sec=(t,n,body)=>`<details class=card><summary><b>${t}</b> (${bn(n)})</summary>${body||'<small>—</small>'}</details>`;
 return `${back()}<h2>${T('খামার','Farm')}</h2>
 <div class="card in"><small>${T('মোট বিক্রি','Total sales')}</small><b style="display:block;font-size:24px">${M(sales)}</b><small>${T('খরচ','Costs')}: ${M(spent)}${due>0?' · '+T('বাকি পাওনা','Unpaid')+': '+M(due):''}</small><div class="${prof>=0?'pos':'neg'}" style="margin-top:6px">${T('মোট লাভ-ক্ষতি','Net profit / loss')}: ${sgn(prof)}</div></div>
 ${rem.length?`<div class=card><b>💉 ${T('টিকা/ওষুধ রিমাইন্ডার','Vaccine / medicine reminders')}</b>${rem.map(v=>`<div class=row><div>${esc(vname(v))}<small class="${v.due<today()?'neg':''}">${v.due}${v.due<today()?' · '+T('মেয়াদ পার','overdue'):''}</small></div><button class=pri style="width:auto;margin:0" onclick="fmDone(${v.id})">✓ ${T('হয়েছে','Done')}</button></div>`).join('')}</div>`:''}
 <div class=g2><button class=bt onclick="fmAdd('an')">+ ${T('পশু/ব্যাচ','Animal / batch')}</button><button class=bt onclick="fmAdd('fd')">+ ${T('খাবার খরচ','Feed cost')}</button><button class=bt onclick="fmAdd('sl')">+ ${T('বিক্রি','Sale')}</button><button class=bt onclick="fmAdd('vc')">+ ${T('টিকা/ওষুধ','Vaccine / medicine')}</button><button class=bt onclick="fmAdd('ex')">+ ${T('অন্য খরচ','Other expense')}</button><button class=bt onclick="V='set';go()">⚙ ${T('আমার ধরন','My type')}</button></div>
 ${fieldCard()}
 <h3>${T('পশু ও ব্যাচ','Animals & batches')}</h3>${anim}
 ${sec(T('খাবারের হিসাব','Feed log'),f.fd.length,f.fd.slice().reverse().slice(0,30).map(e=>fr((e.item||T('খাবার','Feed'))+(e.kg?' · '+bn(e.kg)+' '+T('কেজি','kg'):''),e.date+(e.aid?' · '+albl(e.aid):''),M(e.amt),'neg','fd',e.id)).join(''))}
 ${sec(T('বিক্রির তালিকা','Sales'),f.sl.length,f.sl.slice().reverse().slice(0,30).map(s=>{const d=(s.amt||0)-(s.paid||0);return fr(L(SL,s.what)+(s.buyer?' · '+s.buyer:''),s.date+(s.aid?' · '+albl(s.aid):'')+(d>0?' · '+T('বাকি ','Unpaid ')+M(d):''),M(s.amt),'pos','sl',s.id,d>0?`<button class=x onclick="fmCollect(${s.id})">💰</button>`:'')}).join(''))}
 ${sec(T('অন্য খরচ','Other expenses'),f.ex.length,f.ex.slice().reverse().slice(0,30).map(e=>fr(L(XC,e.cat),e.date+(e.aid?' · '+albl(e.aid):'')+(e.note?' · '+e.note:''),M(e.amt),'neg','ex',e.id)).join(''))}
 ${sec(T('টিকা ও ওষুধের তালিকা','Vaccines & medicine'),f.vc.length,f.vc.slice().sort((a,b)=>a.due<b.due?1:-1).slice(0,30).map(v=>fr((v.done?'✔ ':'')+vname(v),(v.done?v.donedate:v.due)+(v.cost>0?' · '+M(v.cost):''),'','','vc',v.id)).join(''))}`;
};
Object.defineProperty(PAGE_META,'farm',{enumerable:true,get:()=>[T('ব্যবসা ও খামার','Business & farm'),T('খামার ম্যানেজার','Farm manager'),T('পশু, খাবার, বিক্রি, লাভ-ক্ষতি ও টিকার হিসাব এক জায়গায়।','Animals, feed, sales, profit and vaccine reminders in one place.')]});
document.head.insertAdjacentHTML('beforeend','<style>.fm-chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px}.fm-chips button{white-space:nowrap;padding:8px 16px;border-radius:99px;font-size:14px}.fm-chips button.on{background:var(--g,#15803d);color:#fff}</style>');
setTimeout(()=>{if(V=='home')go()},0);
})();
</script>
</body></html>
